# TeamSpeak 3 Bot – Konfiguration (UTF-8)
# Für Schlüssel, die in dieser Datei fehlen, nutzt der Bot beim Laufen die Standardwerte.
# Die Datei selbst verändert er dabei nicht.

# --- Verbindung ---------------------------------------------------------------
# Adresse des TeamSpeak-Servers
host=127.0.0.1
# ServerQuery-Port (Standard 10011)
query.port=10011
# Port des virtuellen Servers (Voice-Port, Standard 9987)
port=9987
# ServerQuery-Login
user=serveradmin
password=12345
# Anzeigename des Bots
nickname=TSBotByFloxiii
# "default" = Befehle gedrosselt (sicher ohne Query-Whitelist),
# "unlimited" = ungedrosselt (nur wenn die Bot-IP in query_ip_allowlist.txt steht)
query.flood-rate=default
# Nach Verbindungsabbruch automatisch neu verbinden
reconnect=true
# Wird beim Start an den ganzen Server geschickt (leer lassen = keine Nachricht)
startup.message=[INFO] TeamSpeak Bot by [URL=http://floxiii.net]Floxiii[/URL] erfolgreich gestartet.

# --- Anti-Bot-Gruppe ----------------------------------------------------------
# Bei Mitgliedern dieser Gruppe verändert der Bot keine Ränge automatisch
# (weder Mitglied noch Treue-Ränge). !ruhe funktioniert weiterhin.
exempt-group=410

# --- Befehl !ruhe -------------------------------------------------------------
# Schaltet die Servergruppe an/aus
command.ruhe.group=416
command.ruhe.name=Ruhe
command.ruhe.cooldown-seconds=5

# --- Befehl !botinfo ----------------------------------------------------------
command.botinfo.message=Dieser TeamSpeak verwendet einen TeamSpeak Bot von [URL=http://floxiii.net]Floxiii[/URL].

# --- Befehl !help -------------------------------------------------------------
# \n ist ein Zeilenumbruch
command.help.message=Verfügbare Befehle:\n[B]!ruhe[/B] – Ruhe-Rang an- oder ausschalten\n[B]!treue [Name][/B] – zeigt, wie lange du oder jemand anderes dabei ist und wann der nächste Rang kommt\n[B]!botinfo[/B] – Infos zum Bot\n[B]!help[/B] – diese Hilfe

# --- Befehl !treue ------------------------------------------------------------
# {days} = Dauer seit dem ersten Besuch, {next} = nächster Rang, {remaining} = Dauer bis dahin
# Ab 365 Tagen wird die Dauer in Jahren und Tagen angegeben, z. B. "11 Jahren und 212 Tagen".
command.treue.message-next=Du bist seit {days} dabei. Nächster Rang: [B]{next}[/B] in {remaining}.
# Höchster Rang erreicht
command.treue.message-max=Du bist seit {days} dabei und hast den höchsten Treue-Rang erreicht. Vielen Dank für deine Treue :)
# Für Nutzer in der Anti-Bot-Gruppe oder wenn die Treue-Ränge abgeschaltet sind
command.treue.message-no-ranks=Für dich werden keine Treue-Ränge automatisch vergeben.
# Antworten auf !treue <Name>. {name} = Nickname des gesuchten Nutzers
command.treue.other-next={name} ist seit {days} dabei. Nächster Rang: [B]{next}[/B] in {remaining}.
command.treue.other-max={name} ist seit {days} dabei und hat den höchsten Treue-Rang erreicht.
command.treue.other-no-ranks=Für {name} werden keine Treue-Ränge automatisch vergeben.
command.treue.other-unknown={name} wurde nicht gefunden.

# --- Fehler bei Befehlen ------------------------------------------------------
# Antwort, wenn ein Befehl unerwartet fehlschlägt. Die Ursache steht im Log.
command.error-message=Das hat leider nicht geklappt, bitte wende dich an einen Admin.

# --- Erreichbarkeit des Bots --------------------------------------------------
# Der Bot ist unsichtbar, Nutzer können ihn also nicht von sich aus anschreiben.
# Schreibt er sie zuerst an, öffnet sich ein Chat-Tab, in dem sie antworten können.
# Wird beim allerersten Besuch geschickt (leer lassen = keine Nachricht)
welcome.message=Willkommen auf unserem TeamSpeak! Schreib mir hier [B]!help[/B], um alle Befehle zu sehen.
# message = Chat-Nachricht (öffnet den Tab), poke = Anstupsen (auf 100 Zeichen begrenzt, öffnet keinen Tab)
welcome.type=message
# false = bei jedem Betreten des Servers
welcome.first-visit-only=true
# ID eines Channels, in den sich der Bot setzt. Wer ihn betritt, bekommt die Befehlsliste
# (command.help.message) privat. Dort funktionieren die Befehle auch im Channel-Chat.
# Leer lassen = aus. Nicht den Standard-Channel eintragen, sonst bekommt sie jeder bei jedem Join.
bot-channel.id=

# --- Regelmäßige Rang-Prüfung -------------------------------------------------
# Prüft in diesem Abstand die Ränge aller Online-Nutzer (0 = nur beim Join prüfen)
rank-check.interval-minutes=5

# --- Mitglied nach Wartezeit --------------------------------------------------
# Wer in guest-group (Gast, Standardgruppe) ist und vor mindestens delay-minutes
# zum ersten Mal auf dem Server war, bekommt die member-group.
member.enabled=true
member.guest-group=11
member.member-group=10
member.delay-minutes=10

# --- Treue-Ränge --------------------------------------------------------------
# Jeder bekommt den höchsten erreichten Rang, alle anderen Treue-Ränge werden
# entfernt. Gemessen wird ab dem ersten Besuch auf dem Server.
loyalty.enabled=true
# {label} wird durch die Bezeichnung des Rangs ersetzt
loyalty.message=Du bist nun [COLOR=#aa0000][U][B]{label}[/B][/U][/COLOR] dabei und hast einen Rang erhalten! Vielen Dank für deine Treue :) Antworte hier mit [B]!treue[/B] oder [B]!help[/B].
# Format: loyalty.rank.<nr>=<tage>;<gruppen-id>;<bezeichnung>
# Sobald hier eigene Ränge stehen, ersetzen sie die Standard-Ränge vollständig.
# (Der alte Bot hat mit 30-Tage-Monaten gerechnet, daher 1 Jahr = 360 Tage.)
loyalty.rank.1=180;315;6 Monate
loyalty.rank.2=360;316;1 Jahr
loyalty.rank.3=720;317;2 Jahre
loyalty.rank.4=1080;318;3 Jahre
loyalty.rank.5=1440;409;4 Jahre
loyalty.rank.6=1800;417;5 Jahre
loyalty.rank.7=2160;422;6 Jahre
loyalty.rank.8=2520;423;7 Jahre

# =============================================================================
# Weitere Funktionen. Alle sind standardmäßig aus (enabled=false).
# Gruppen und Channels werden als IDs angegeben, mehrere durch Komma getrennt.
# Verbotene Namen sind durch Semikolon getrennte reguläre Ausdrücke, ohne
# Unterscheidung von Groß-/Kleinschreibung. Ein Backslash muss doppelt stehen (\\d).
# =============================================================================

# So oft prüft der Bot Abwesenheit, Stummschaltung, Untätigkeit, Aufnahmen und Nicknames
monitor.interval-seconds=10

# --- Ankündigungen ------------------------------------------------------------
# target: server = Server-Chat, channel = Chat des Channels, in dem der Bot sitzt
announcement.enabled=false
announcement.interval-minutes=60
announcement.target=server
announcement.message=

# --- Automatisches Verschieben beim Betreten des Servers ----------------------
# Nutzer dieser Gruppen werden verschoben. Wer einen eigenen Start-Channel in den
# Favoriten hat, also nicht im Standard-Channel landet, bleibt dort.
auto-move.enabled=false
auto-move.groups=
auto-move.channel=

# --- Verschieben bei Abwesenheit ----------------------------------------------
# Bei Rückkehr geht es zurück in den alten Channel. message ist optional und geht privat an den Nutzer.
away.enabled=false
away.channel=
away.message=
away.ignore-groups=
away.ignore-channels=

# --- Verschieben bei Stummschaltung -------------------------------------------
# type: any = Mikrofon oder Lautsprecher, all = beides, input = Mikrofon, output = Lautsprecher
mute.enabled=false
mute.type=any
mute.delay-seconds=60
mute.channel=
mute.message=
mute.ignore-groups=
mute.ignore-channels=

# --- Untätigkeitsprüfung ------------------------------------------------------
# action: move = verschieben, kick = vom Server kicken (message = Kick-Grund)
# warn-minutes: Warnung vorher, 0 = keine Warnung
idle.enabled=false
idle.action=move
idle.minutes=60
idle.warn-minutes=0
idle.warn-message=Du bist seit einiger Zeit inaktiv und wirst bald verschoben.
idle.channel=
idle.message=
idle.ignore-groups=
idle.ignore-channels=

# --- Schutz vor Aufnahmen -----------------------------------------------------
# action: move = verschieben, kick = vom Server kicken (message = Kick-Grund)
recording.enabled=false
recording.action=move
recording.channel=
recording.message=Aufnahmen sind auf diesem Server nicht erlaubt.
recording.ignore-groups=
recording.ignore-channels=

# --- Unerlaubte Nicknames -----------------------------------------------------
# action: warn = private Nachricht, kick oder ban. Beim Kick und Ban ist message der Grund.
nickname.enabled=false
nickname.forbidden=
nickname.action=warn
nickname.ban-minutes=60
nickname.message=Dein Nickname ist auf diesem Server nicht erlaubt. Bitte ändere ihn.
nickname.ignore-groups=

# --- Unerlaubte Channelnamen --------------------------------------------------
# Greift, wenn ein Channel angelegt oder bearbeitet wird. delete=true löscht ihn samt
# Unterchanneln, auch wenn Nutzer darin sind.
# action richtet sich gegen den Nutzer, der den Channel angelegt oder bearbeitet hat: none, warn, kick oder ban
channel-name.enabled=false
channel-name.forbidden=
channel-name.delete=false
channel-name.action=warn
channel-name.ban-minutes=60
channel-name.message=Dieser Channelname ist auf diesem Server nicht erlaubt.
channel-name.ignore-groups=
channel-name.ignore-channels=

# --- Channel-Überwachung ------------------------------------------------------
# Informiert Gruppen, wenn jemand einen dieser Channels betritt, z. B. einen Wartebereich für Support.
# type: message oder poke (ein Poke ist auf 100 Zeichen begrenzt). {client} = Nutzer, {channel} = Channel
channel-watch.enabled=false
channel-watch.channels=
channel-watch.notify-groups=
channel-watch.type=poke
channel-watch.message={client} wartet in {channel}.

# --- Servergruppen-Benachrichtigung -------------------------------------------
# Informiert notify-groups, wenn ein Mitglied von groups online kommt. {client} = Nutzer
group-notify.enabled=false
group-notify.groups=
group-notify.notify-groups=
group-notify.type=message
group-notify.message={client} ist jetzt online.

# --- Inaktive Channels --------------------------------------------------------
# Löscht Channels, die max-empty-days leer waren. Der Standard-Channel, Channels mit
# Unterchanneln und alle Channels, die der Bot selbst braucht, bleiben immer erhalten.
# keep-permanent: permanente Channels nie löschen, nur semi-permanente.
# dry-run: nennt die Channels nur im Log. Erst nach Prüfung des Logs auf false setzen.
inactive-channel.enabled=false
inactive-channel.check-minutes=60
inactive-channel.max-empty-days=30
inactive-channel.keep-permanent=true
inactive-channel.dry-run=true
inactive-channel.ignore-channels=

# --- Zuletzt gesehen ----------------------------------------------------------
# {name} = Nickname, {date} = letzter Besuch
seen.enabled=false
seen.command=!seen
seen.help-line=[B]!seen <Name>[/B] – zeigt, wann jemand zuletzt online war
seen.usage=Verwendung: !seen <Name>
seen.message-online={name} ist gerade online.
seen.message-offline={name} war zuletzt am {date} online.
seen.message-unknown={name} ist hier nicht bekannt.

# --- Servergruppen-Schutz -----------------------------------------------------
# Nur erlaubte Nutzer dürfen Mitglied von groups sein, alle anderen entfernt der Bot.
# Beim ersten Lauf werden die aktuellen Mitglieder als erlaubt übernommen.
# Die Liste steht in group-protection.properties neben der jar.
# Die Liste ändern per Chat: !schutz-add <Gruppe> <Name oder Unique-ID> und
# !schutz-del <Gruppe> <Name oder Unique-ID>. Ein Name muss dabei online sein.
# Das dürfen die Mitglieder von admin-groups (Gruppen-IDs) und die Nutzer in admin-users
# (Unique-IDs), jeweils durch Komma getrennt. Sind beide leer, darf es niemand.
# Keine Gruppen eintragen, die der Bot selbst vergibt (Member, Treue-Ränge, Ruhe).
group-protect.enabled=false
group-protect.check-seconds=60
group-protect.groups=
group-protect.admin-groups=
group-protect.admin-users=
group-protect.usage=Verwendung: !schutz-add <Gruppe> <Name oder Unique-ID> oder !schutz-del <Gruppe> <Name oder Unique-ID>
group-protect.message-disabled=Der Gruppen-Schutz ist auf diesem Server nicht eingeschaltet.
group-protect.message-denied=Du darfst den Gruppen-Schutz nicht bearbeiten.
# {group} = eingegebene Gruppe, {groups} = alle geschützten Gruppen
group-protect.message-not-protected=Gruppe {group} ist nicht geschützt. Geschützte Gruppen: {groups}
group-protect.message-added={name} ist jetzt für Gruppe {group} erlaubt.
group-protect.message-removed={name} ist nicht mehr für Gruppe {group} erlaubt.
group-protect.message-not-found={name} wurde nicht gefunden.
